<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic chrome gradients -->
    <linearGradient id="outerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f2"/>
      <stop offset="20%" stop-color="#9a9aa0"/>
      <stop offset="45%" stop-color="#4a4a50"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#808088"/>
      <stop offset="100%" stop-color="#f8f8fa"/>
    </linearGradient>

    <linearGradient id="innerPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <linearGradient id="chromeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888892"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#707078"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#555560"/>
    </linearGradient>

    <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="redAura" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF2020" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Background Disc -->
  <circle cx="250" cy="250" r="240" fill="#060608" filter="url(#metalShadow)"/>

  <!-- Outer Riveted Metallic Bezel Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#outerRing)" stroke-width="26"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#redNeon)" stroke-width="2" opacity="0.8"/>

  <!-- Metallic Rivets around Bezel -->
  <g fill="#d8d8de" stroke="#18181b" stroke-width="2">
    <circle cx="250" cy="25" r="7"/>
    <circle cx="360" cy="55" r="7"/>
    <circle cx="445" cy="140" r="7"/>
    <circle cx="475" cy="250" r="7"/>
    <circle cx="445" cy="360" r="7"/>
    <circle cx="360" cy="445" r="7"/>
    <circle cx="250" cy="475" r="7"/>
    <circle cx="140" cy="445" r="7"/>
    <circle cx="55" cy="360" r="7"/>
    <circle cx="25" cy="250" r="7"/>
    <circle cx="55" cy="140" r="7"/>
    <circle cx="140" cy="55" r="7"/>
  </g>

  <!-- Inner Textured Plate -->
  <circle cx="250" cy="250" r="208" fill="url(#innerPlate)"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="url(#chromeGlow)" stroke-width="6" opacity="0.65"/>

  <!-- Headphones Arc -->
  <path d="M 115 250 A 135 135 0 0 1 385 250" fill="none" stroke="url(#chromeGlow)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 125 250 A 125 125 0 0 1 375 250" fill="none" stroke="#E50914" stroke-width="3" opacity="0.85"/>

  <!-- Headphone Left Earcup -->
  <g transform="translate(85, 205)">
    <rect x="0" y="0" width="46" height="85" rx="14" fill="url(#chromeGlow)" stroke="#111115" stroke-width="3"/>
    <rect x="10" y="10" width="16" height="65" rx="6" fill="#18181b"/>
    <rect x="42" y="12" width="12" height="60" rx="5" fill="#25252b"/>
  </g>

  <!-- Headphone Right Earcup -->
  <g transform="translate(369, 205)">
    <rect x="0" y="0" width="46" height="85" rx="14" fill="url(#chromeGlow)" stroke="#111115" stroke-width="3"/>
    <rect x="20" y="10" width="16" height="65" rx="6" fill="#18181b"/>
    <rect x="-8" y="12" width="12" height="60" rx="5" fill="#25252b"/>
  </g>

  <!-- Vintage Studio Condenser Microphone -->
  <g transform="translate(200, 100)" filter="url(#metalShadow)">
    <!-- Capsule Body -->
    <rect x="0" y="0" width="100" height="150" rx="45" fill="url(#chromeGlow)" stroke="#111115" stroke-width="4"/>
    <rect x="8" y="8" width="84" height="134" rx="38" fill="#151518"/>

    <!-- Microphone Grille Slots (Horizontal) -->
    <g fill="url(#chromeGlow)">
      <rect x="22" y="24" width="56" height="5" rx="2.5"/>
      <rect x="18" y="36" width="64" height="5" rx="2.5"/>
      <rect x="16" y="48" width="68" height="5" rx="2.5"/>
      <rect x="16" y="60" width="68" height="5" rx="2.5"/>
      <rect x="18" y="72" width="64" height="5" rx="2.5"/>
      <rect x="20" y="84" width="60" height="5" rx="2.5"/>
      <rect x="24" y="96" width="52" height="5" rx="2.5"/>
      <rect x="28" y="108" width="44" height="5" rx="2.5"/>
      <rect x="34" y="120" width="32" height="5" rx="2.5"/>
    </g>

    <!-- Center Vertical Rib -->
    <rect x="47" y="14" width="6" height="120" fill="url(#outerRing)"/>
  </g>

  <!-- Horizontal Metallic Banner Plate -->
  <g transform="translate(75, 295)" filter="url(#metalShadow)">
    <!-- Banner Outer Chrome Frame -->
    <rect x="0" y="0" width="350" height="110" rx="16" fill="#09090c" stroke="url(#chromeGlow)" stroke-width="5"/>
    <rect x="6" y="6" width="338" height="98" rx="12" fill="none" stroke="#E50914" stroke-width="2"/>

    <!-- Text: ROCK & METAL -->
    <text x="175" y="46" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#f8f8fa" text-anchor="middle" letter-spacing="3" stroke="#000" stroke-width="1.5">
      ROCK <tspan fill="#FF2020">&amp;</tspan> METAL
    </text>

    <!-- Text: RADIO -->
    <text x="175" y="88" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#d0d0d8" text-anchor="middle" letter-spacing="8" stroke="#000" stroke-width="1.5">
      RADIO
    </text>

    <!-- Side Accent Wings -->
    <path d="M 22 66 L 36 60 L 36 72 Z" fill="#E50914"/>
    <path d="M 328 66 L 314 60 L 314 72 Z" fill="#E50914"/>
  </g>
</svg>
